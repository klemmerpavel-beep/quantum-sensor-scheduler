/* ── Основа */
*, *::before, *::after { box-sizing: border-box; }

/* ── Страница и карточки */
.page { width: 100%; padding: var(--sp-4) var(--sp-5) var(--sp-6); display: grid; gap: var(--sp-4); align-content: start; }

.phead { display: grid; gap: var(--sp-3); }

/* Ближайшие вехи */

.slist { list-style: none; margin: 0 calc(-1 * var(--sp-2)); padding: 0; }

.stl-grid { position: absolute; top: 0; height: 112px; border-left: 1px dashed var(--border); }

.stl-bar { position: absolute; top: 0; height: 110px; display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: var(--sp-0); margin-left: 3px; padding-bottom: 3px; }
.stl-bar i { display: block; border-radius: 2px; }
.stl-bar i.closed { background: var(--st-closed); }
.stl-bar i.overdue { background: var(--st-overdue); }
.stl-bar i.open { background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--border-strong); }
.stl-bar b { font-size: var(--fs-12); font-weight: 600; color: var(--text-2); text-align: center; line-height: 1; margin-top: var(--sp-0); }
.stl-ms { position: absolute; top: 106px; width: 14px; height: 14px; margin-left: -7px; transform: rotate(45deg); background: var(--surface); border: 2px solid var(--text-1); z-index: 1; }
.stl-ms.past { background: var(--text-1); }
.stl-lbl { position: absolute; z-index: 1; font-size: var(--fs-12); line-height: 18px; white-space: nowrap; color: var(--text-1); padding: 0 var(--sp-1h) 0 var(--sp-1); margin-left: -1px; background: var(--surface); border-left: 1px solid var(--border-strong); }
.stl-lbl.r { transform: translateX(-100%); padding: 0 var(--sp-1) 0 var(--sp-1h); margin-left: 1px; border-left: 0; border-right: 1px solid var(--border-strong); }
.stl-lbl b { font-weight: 600; margin-right: var(--sp-0); }
.stl-lbl.past { color: var(--text-3); }
.stl-tick { position: absolute; top: 122px; width: 1px; background: var(--border-strong); }
.stl-today { position: absolute; top: -4px; height: 122px; width: 2px; margin-left: -1px; background: var(--accent); z-index: 2; }
.stl-today span { position: absolute; top: -2px; left: 6px; font-size: var(--fs-12); font-weight: 600; color: var(--accent); white-space: nowrap; background: var(--surface); padding: 0 var(--sp-1); }
.stl-leg { margin-top: var(--sp-2); padding-top: var(--sp-2h); border-top: 1px solid var(--surface-3); }
.lg.overdue-s { background: var(--st-overdue); }
.lg.ms { width: 9px; height: 9px; border-radius: 0; transform: rotate(45deg); border: 2px solid var(--text-1); background: var(--surface); margin-right: var(--sp-2); }

/* Путь к демонстрации */
.path { list-style: none; margin: var(--sp-2) 0 0; padding: 0; display: flex; }
.step { position: relative; flex: 1 1 0; min-width: 0; display: grid; justify-items: center; align-content: start; gap: var(--sp-1h); text-align: center; padding: 0 var(--sp-1); }
.step .dot {
  position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  border: 2px solid var(--border-strong); background: var(--surface); color: var(--text-2); font-weight: 600; font-size: var(--fs-13);
  transition: border-color var(--dur);
}
.step .dot:hover { border-color: var(--accent); }
.step.done .dot { background: var(--st-closed); border-color: var(--st-closed); color: var(--surface); }
.step.late .dot { background: var(--st-overdue); border-color: var(--st-overdue); color: var(--surface); }
.step.soon .dot { border-color: var(--st-action); color: var(--b-action-fg); }
.step .lbl { margin-top: var(--sp-1); font-size: var(--fs-13); font-weight: 500; line-height: var(--lh-snug); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.step .d { font-size: var(--fs-12); color: var(--text-2); }
.step.late .d { color: var(--b-overdue-fg); font-weight: 500; }
.step.soon .d { color: var(--b-action-fg); }
.step .link { position: absolute; top: 15px; right: calc(50% + 20px); left: calc(-50% + 20px); height: 2px; background: var(--border-strong); border-radius: 1px; }
.link.done { background: var(--st-closed); }
.link.eroding { background: var(--st-action); height: 4px; top: 14px; }
.link.breach { background: var(--st-overdue); height: 4px; top: 14px; }
.link.overlap { background: repeating-linear-gradient(90deg, var(--border-strong) 0 4px, transparent 4px 8px); }
.path.big .step .lbl { font-size: var(--fs-14); }
.path.big .step .dot { width: 40px; height: 40px; font-size: var(--fs-14); }
.path.big .step .link { top: 19px; right: calc(50% + 24px); left: calc(-50% + 24px); }
.path.big .link.eroding, .path.big .link.breach { top: 18px; }
.path.vert { flex-direction: column; margin-top: 0; }
.path.vert .step { flex: none; display: grid; grid-template-columns: 32px minmax(0, 1fr); grid-template-rows: 22px 20px; justify-items: start; align-items: center; text-align: left; gap: 0 var(--sp-2h); height: 64px; padding: 0; align-content: start; }
.path.vert .step .dot { grid-row: 1 / span 2; }
.path.vert .step .lbl { margin: 0; -webkit-line-clamp: 1; font-size: var(--fs-14); align-self: end; }
.path.vert .step .d { align-self: start; font-size: var(--fs-13); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.path.vert .step .link { left: 15px; right: auto; top: -32px; width: 2px; height: 32px; }
.path.vert .link.eroding, .path.vert .link.breach { width: 4px; left: 14px; top: -32px; height: 32px; }
.path.vert .link.overlap { background: repeating-linear-gradient(180deg, var(--border-strong) 0 4px, transparent 4px 8px); }
.pnotes { list-style: none; margin: var(--sp-4) 0 0; padding: var(--sp-3) 0 0; border-top: 1px solid var(--border); display: grid; gap: var(--sp-1h); color: var(--text-2); font-size: var(--fs-13); line-height: var(--lh-body); }
.pnotes li { position: relative; padding-left: var(--sp-3); }
.pnotes li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); }

/* ── График работ (Гант) */
.app > main.v-gantt, .app > main.v-board { flex: none; display: flex; flex-direction: column; height: calc(100vh - var(--header-h)); }
.gwrap { flex: 1; min-height: 0; overflow: auto; position: relative; background: var(--surface); }

.gantt th, .gantt td { height: var(--row-gantt); padding: 0 var(--sp-2); border-bottom: 1px solid var(--surface-3); text-align: left; vertical-align: middle; font-weight: 400; line-height: var(--lh-tight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gantt th:first-child, .gantt td:first-child { padding-left: var(--sp-4); }
.gantt thead th { position: sticky; top: 0; z-index: 3; height: var(--axis-h); background: var(--surface); color: var(--text-3); font-size: var(--fs-12); font-weight: 500; border-bottom: 1px solid var(--border); }
.gantt col.c-name { width: 272px; } .gantt col.c-own { width: 200px; } .gantt col.c-due { width: 172px; } .gantt col.c-st { width: 156px; }
.gantt tbody tr { cursor: pointer; }
.gantt tbody tr:hover td { background: var(--surface-2); }
.gantt tr.sec td { background: var(--surface-2); font-weight: 600; border-bottom-color: var(--border); }
.gantt tr.grp td:first-child { font-weight: 500; }
.gantt td.secsum { font-weight: 400; font-size: var(--fs-12); color: var(--text-2); }
.secsum .ss { margin-right: var(--sp-3); }
.gantt tr.sel td { background: var(--accent-soft); }
.gantt tr:focus-visible { outline-offset: -2px; }
.gantt td.own { color: var(--text-2); }
.gantt td.due .due-t { margin-left: var(--sp-2); font-size: var(--fs-12); }
.gantt .nm { display: flex; align-items: center; gap: var(--sp-1); min-width: 0; }
.gantt .nm .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gantt .nm.lv2 { padding-left: 0; } .gantt .nm.lv3 { padding-left: var(--sp-3h); } .gantt .nm.lv4 { padding-left: 40px; } .gantt .nm.lv5 { padding-left: 60px; }
.gantt .cnt { margin-left: auto; padding-left: var(--sp-2); color: var(--text-3); font-size: var(--fs-12); font-weight: 400; }
.chev { width: 20px; height: 20px; flex: none; display: inline-grid; place-items: center; border: 0; background: transparent; color: var(--text-3); padding: 0; border-radius: var(--radius-1); }
.chev:hover { color: var(--text-1); background: var(--surface-3); }
.chev .ico { transition: transform var(--dur); }
.chev[aria-expanded="false"] .ico { transform: rotate(-90deg); }
.chev-sp { width: 20px; flex: none; }
.tlcell { position: relative; padding: 0 !important; }
.tlin { position: absolute; inset: 0; }
.axis { position: relative; height: 100%; }
.axis .m { position: absolute; top: 4px; font-size: var(--fs-12); color: var(--text-2); white-space: nowrap; padding-left: var(--sp-1h); border-left: 1px solid var(--border); height: 16px; line-height: 16px; }
.grid-bg { position: absolute; inset: 0; pointer-events: none; }
.grid-bg .gm { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--surface-3); }
.todayline { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); z-index: 2; pointer-events: none; }
.axis .todaylbl { position: absolute; top: 20px; transform: translateX(calc(-100% - 4px)); font-size: var(--fs-12); font-weight: 600; color: var(--accent); white-space: nowrap; line-height: 16px; background: var(--surface); padding: 0 var(--sp-0); }
.axis .msd { position: absolute; bottom: 5px; width: 9px; height: 9px; margin-left: -4px; transform: rotate(45deg); background: var(--surface); border: 2px solid var(--text-2); }
.bar { position: absolute; top: 50%; height: 12px; margin-top: -6px; border-radius: 3px; min-width: 4px; }
.bar.closed { background: var(--st-closed); }
.bar.progress { background: var(--st-progress); }
.bar.action { background: var(--st-action); }
.bar.future { background: var(--surface-3); border: 1px solid var(--border-strong); }
.bar .der { position: absolute; left: 0; top: 0; bottom: 0; background: var(--surface); opacity: calc(1 - var(--derived-alpha)); border-radius: 3px 0 0 3px; }
.bar.future .der { display: none; }
.bar.chain { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.bar .ok { position: absolute; right: -18px; top: -2px; color: var(--st-closed); }
.bar .ok .ico { width: 14px; height: 14px; }
.bar.group { height: 6px; margin-top: -3px; background: var(--border-strong); opacity: 1; }
.bar.group.closed { background: var(--st-closed); }
.bar.group .gp { position: absolute; left: 0; top: 0; bottom: 0; background: var(--st-closed); border-radius: 3px; }
.secspan { position: absolute; top: 50%; height: 2px; margin-top: -1px; background: var(--border-strong); }
.od { position: absolute; top: 50%; height: 12px; margin-top: -6px; background: repeating-linear-gradient(45deg, var(--st-overdue) 0 2px, transparent 2px 6px); border: 1px solid var(--st-overdue); border-radius: 0 3px 3px 0; }
.ctl { position: absolute; top: 50%; width: 2px; height: 20px; margin-top: -10px; background: var(--text-1); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); font-size: var(--fs-12); color: var(--text-2); }
.gleg { flex: none; min-height: 40px; padding: var(--sp-2) var(--sp-4); background: var(--surface); border-top: 1px solid var(--border); }
.lg { display: inline-block; width: 16px; height: 8px; border-radius: 2px; margin-right: var(--sp-1h); vertical-align: 0; }
.lg.closed { background: var(--st-closed); } .lg.progress { background: var(--st-progress); } .lg.action { background: var(--st-action); }
.lg.future { background: var(--surface-3); border: 1px solid var(--border-strong); }
.lg.overdue { background: repeating-linear-gradient(45deg, var(--st-overdue) 0 2px, transparent 2px 6px); border: 1px solid var(--st-overdue); }
.lg.der { background: var(--st-progress); opacity: var(--derived-alpha); }
.lg.ctl { position: static; margin: 0 var(--sp-1h) 0 0; width: 2px; height: 14px; background: var(--text-1); vertical-align: -3px; }
.lg.chain { background: var(--surface-3); box-shadow: 0 0 0 2px var(--accent); }
.gstrip { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); background: var(--surface-2); border-bottom: 1px solid var(--border); }
.gstrip .kpi { padding: var(--sp-2h) var(--sp-3); box-shadow: none; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; column-gap: var(--sp-3); row-gap: 0; }
.gstrip .kpi .lbl { grid-column: 1 / -1; }
.gstrip .kpi .val { font-size: var(--fs-18); margin: 0; }
.gstrip .kpi .sub { font-size: var(--fs-12); line-height: var(--lh-tight); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { padding: var(--sp-5) var(--sp-4); color: var(--text-2); display: grid; gap: var(--sp-3); justify-items: start; }

/* Мобильный список «Графика работ» */
.mlist { display: none; }
.mcard {
  display: grid; gap: var(--sp-1h); width: 100%; text-align: left; padding: var(--sp-2h) var(--sp-3); min-height: var(--hit);
  border: 0; border-bottom: 1px solid var(--border); background: var(--surface);
}
.mcard .t { font-weight: 500; }
.mcard .r { display: flex; gap: var(--sp-1) var(--sp-3); flex-wrap: wrap; align-items: center; font-size: var(--fs-13); color: var(--text-2); }
.mhead { position: sticky; top: 0; background: var(--surface-2); padding: var(--sp-2h) var(--sp-3); font-weight: 600; border-bottom: 1px solid var(--border); z-index: 1; }

/* ── Ближайшие сроки */
.lane { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-3); box-shadow: var(--shadow-1); overflow: hidden; }
.lane > summary {
  display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-4); min-height: 52px; list-style: none; cursor: pointer;
  font-size: var(--fs-16); font-weight: 600;
}
.lane > summary::-webkit-details-marker { display: none; }
.lane > summary .chev { color: var(--text-3); }
.lane[open] > summary { border-bottom: 1px solid var(--border); }
.lane:not([open]) > summary .chev .ico { transform: rotate(-90deg); }
.lane .rng { margin-left: auto; font-size: var(--fs-13); font-weight: 400; color: var(--text-3); }
.fhead { display: grid; grid-template-columns: minmax(0, 1fr) 240px 96px 176px 220px; gap: var(--sp-3); padding: var(--sp-2h) var(--sp-4) var(--sp-1h); font-size: var(--fs-12); color: var(--text-3); font-weight: 500; }
.lane .cnt { display: inline-grid; place-items: center; min-width: 24px; height: 22px; padding: 0 var(--sp-2); border-radius: 11px; background: var(--surface-3); color: var(--text-2); font-size: var(--fs-12); font-weight: 600; }
.lane.overdue .cnt { background: var(--b-overdue-bg); color: var(--b-overdue-fg); }
.lane.h14 .cnt { background: var(--b-action-bg); color: var(--b-action-fg); }
.lane .empty-line { padding: var(--sp-3) var(--sp-4); }
.frow {
  display: grid; grid-template-columns: minmax(0, 1fr) 240px 96px 176px 220px; gap: var(--sp-3); align-items: center;
  min-height: 52px; padding: var(--sp-2) var(--sp-4); width: 100%; text-align: left; border: 0; background: transparent;
  transition: background-color var(--dur);
}
.frow + .frow { border-top: 1px solid var(--surface-3); }
button.frow:hover { background: var(--surface-2); }
.frow .t { display: grid; gap: var(--sp-0); font-weight: 500; }
.frow .t .st-note { margin: 0; white-space: normal; }
.frow .own { color: var(--text-2); font-size: var(--fs-13); }
.frow .own .co { display: block; margin: 0; }
.frow .d { color: var(--text-2); }
.frow .dw { font-size: var(--fs-13); }
.frow .stc { display: flex; flex-wrap: wrap; gap: var(--sp-0) var(--sp-2); align-items: center; font-size: var(--fs-13); }
.frow .stc .due-t { white-space: normal; font-size: var(--fs-12); }

/* ── Статусы (доска) */
.board { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(176px, 1fr); gap: var(--sp-2h); padding: var(--sp-4); overflow-x: auto; }
.board .col { display: flex; flex-direction: column; min-height: 0; background: var(--surface-3); border-radius: var(--radius-3); }
.board .col > h2 { margin: 0; padding: var(--sp-2h) var(--sp-3) var(--sp-2); display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-13); font-weight: 600; }
.board .col > h2 .st { min-width: 0; white-space: normal; }
.board .col > h2 .cnt { margin-left: auto; color: var(--text-2); font-weight: 500; }
.board .col ul { list-style: none; margin: 0; padding: var(--sp-1) var(--sp-2) var(--sp-2); display: grid; gap: var(--sp-2); overflow-y: auto; align-content: start; }
.board .col .empty-line { padding: var(--sp-1) var(--sp-2); font-size: var(--fs-13); }
.bcard {
  display: grid; gap: var(--sp-1h); width: 100%; text-align: left; padding: var(--sp-2h); border-radius: var(--radius-2);
  border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-1); transition: border-color var(--dur);
}
.bcard:hover { border-color: var(--border-strong); }
.bcard .t { font-weight: 500; font-size: var(--fs-13); line-height: var(--lh-snug); }
.bcard .o { font-size: var(--fs-12); color: var(--text-2); }
.bcard .r { display: flex; gap: var(--sp-1) var(--sp-2); flex-wrap: wrap; align-items: center; font-size: var(--fs-12); color: var(--text-2); }
.bcard .st-note { margin: 0; white-space: normal; }
.bcard.late { box-shadow: inset 3px 0 0 var(--st-overdue), var(--shadow-1); }

/* ── Вехи */
.list { list-style: none; margin: 0; padding: 0; }
.lrow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--sp-3);
  min-height: var(--row); padding: var(--sp-2) var(--sp-2); width: 100%; text-align: left; background: transparent; border: 0; border-radius: var(--radius-2);
  transition: background-color var(--dur);
}
.list li + li .lrow { border-top: 1px solid var(--surface-3); }
button.lrow:hover { background: var(--surface-2); }
.lrow .t { font-weight: 500; display: grid; gap: var(--sp-0); }
.lrow .t .own { font-weight: 400; }
.lrow .own { color: var(--text-2); font-size: var(--fs-13); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .stc { display: flex; gap: var(--sp-2); align-items: center; font-size: var(--fs-13); }
.lrow[aria-pressed="true"] { background: var(--accent-soft); }
.ms-scroll { overflow-x: auto; }
.ms-canvas { position: relative; min-width: 1060px; }
.ms-axis { position: absolute; left: 0; right: 0; top: 140px; height: 2px; background: var(--border-strong); }
.ms-d { position: absolute; top: 134px; width: 14px; height: 14px; margin-left: -7px; transform: rotate(45deg); background: var(--surface); border: 2px solid var(--text-1); z-index: 1; }
.ms-d.past { background: var(--text-1); }
.ms-cl { position: absolute; top: 140px; transform: translateY(calc(-100% - 6px)); width: 8px; margin-left: -4px; display: flex; flex-direction: column-reverse; gap: var(--sp-0); padding: 0; border: 0; background: transparent; border-radius: 2px; }
.ms-cl i { display: block; height: 8px; border-radius: 2px; }
.ms-cl i.closed { background: var(--st-closed); } .ms-cl i.progress { background: var(--st-progress); } .ms-cl i.action { background: var(--st-action); }
.ms-cl i.future { background: var(--surface-3); border: 1px solid var(--border-strong); } .ms-cl i.overdue { background: var(--st-overdue); }
.ms-cl[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 3px; }
.ms-cn { position: absolute; font-size: var(--fs-12); font-weight: 600; transform: translateX(-50%); white-space: nowrap; color: var(--text-2); }
.ms-today { position: absolute; top: 0; height: 150px; width: 2px; margin-left: -1px; background: var(--accent); z-index: 2; }
.ms-today span { position: absolute; top: 0; left: 6px; font-size: var(--fs-12); font-weight: 600; color: var(--accent); white-space: nowrap; }
.ms-month { position: absolute; top: 152px; font-size: var(--fs-12); color: var(--text-2); border-left: 1px solid var(--border); padding-left: var(--sp-1h); height: 16px; }
.cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.mlist3 { list-style: none; margin: 0 calc(-1 * var(--sp-2)); padding: 0; }
.mlist3 li + li .mrow { border-top: 1px solid var(--surface-3); }
.mrow {
  width: 100%; display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; min-height: 52px;
  padding: var(--sp-2); text-align: left; border: 0; background: transparent; border-radius: var(--radius-2); transition: background-color var(--dur);
}
.mrow:hover { background: var(--surface-2); }
.mrow .md { display: flex; align-items: center; gap: var(--sp-2h); }
.mrow .dia { width: 10px; height: 10px; transform: rotate(45deg); border: 2px solid var(--text-1); background: var(--surface); flex: none; }
.mrow.past .dia { background: var(--text-1); }
.mrow .mt { display: grid; gap: var(--sp-0); font-weight: 500; }
.mrow .mw { font-weight: 400; font-size: var(--fs-12); color: var(--text-3); }
.mrow .mr { font-size: var(--fs-13); color: var(--text-2); text-align: right; }
.mrow.past { color: var(--text-2); }

<script>
/* Модуль расчёта «Орбиты». Чистые функции: исходные данные + правки + дата → производные признаки.
   Правила — docs/SPEC.md §4–6; ссылки [Р-NN] — docs/DECISIONS.md. */
const Engine = (() => {
  const DAY = 86400000;
  const STATUSES = ["Не начато", "Нет отметки", "В работе", "Подготовка материалов", "Ожидаем документ", "На согласовании", "Закрыто"];
  const ACTIVE = new Set(["В работе", "Подготовка материалов", "Ожидаем документ", "На согласовании"]);
  const CLS = {
    "Закрыто": "closed", "В работе": "progress", "Подготовка материалов": "progress",
    "Ожидаем документ": "action", "На согласовании": "action", "Нет отметки": "action", "Не начато": "future",
  };

  const dn = (s) => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / DAY; };
  const pad = (x) => String(x).padStart(2, "0");
  const fmt = (n) => { if (n == null) return "—"; const d = new Date(n * DAY); return `${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.${d.getUTCFullYear()}`; };
  const iso = (n) => new Date(n * DAY).toISOString().slice(0, 10);
  const todayLocal = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY; };
  const parseISO = (s) => (/^\d{4}-\d{2}-\d{2}$/.test(s || "") && !isNaN(dn(s)) && iso(dn(s)) === s ? dn(s) : null);

  function calendar(holidays) {
    const H = new Set(holidays.map(dn));
    const isWork = (n) => { const w = new Date(n * DAY).getUTCDay(); return w !== 0 && w !== 6 && !H.has(n); };
    /** Рабочие дни в интервале (a; b] со знаком [Р-47]. */
    const wd = (a, b) => {
      if (a === b) return 0;
      const lo = Math.min(a, b), hi = Math.max(a, b);
      let c = 0;
      for (let x = lo + 1; x <= hi; x++) if (isWork(x)) c++;
      return a < b ? c : -c;
    };
    /** Сдвиг на k рабочих дней (k может быть ≤ 0). */
    const shift = (n, k) => {
      let x = n, left = Math.abs(k);
      const s = k > 0 ? 1 : -1;
      while (left > 0) { x += s; if (isWork(x)) left--; }
      return x;
    };
    const nextWork = (n) => { let x = n + 1; while (!isWork(x)) x++; return x; };
    return { wd, shift, nextWork, isWork };
  }

  const plural = (n, one, few, many) => {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  };
  const remainText = (d) => (d == null ? "" : d > 0 ? `через ${d} дн.` : d === 0 ? "сегодня" : `просрочено ${-d} дн.`);

  /**
   * Построение модели.
   * @param seed   — SEED (data/seed_ymg_stage1.json)
   * @param cfg    — CONFIG (CHAIN, FEEDER, HOLIDAYS, LINKS)
   * @param edits  — правки пользователя { num: {status, closeDoc:{name,letter,date}, comment} }
   * @param T      — «сегодня», номер дня
   */
  function build(seed, cfg, edits, T) {
    const cal = calendar(cfg.HOLIDAYS);
    const items = seed.items.map((s, idx) => ({
      s, idx, num: s.num, kind: s.kind, level: s.level, parent: s.parent, name: s.name,
      owners: s.owners, start: dn(s.start), due: dn(s.due), dueCust: dn(s.due_to_customer),
      ctrl: dn(s.control_date), closedDate: dn(s.closed_date), children: [],
      edit: edits[s.num] || null,
    }));
    const by = Object.fromEntries(items.map((i) => [i.num, i]));
    items.forEach((i) => { if (i.parent) by[i.parent].children.push(i); });
    const isSub = (i) => i.parent && by[i.parent].kind === "group";

    // Отображаемый статус [Р-15]: сначала группы (хранимое/правка), затем работы, затем расчётные группы.
    const own = (i) => {
      if (i.edit && i.edit.status) return { status: i.edit.status, src: "edit" };
      if (i.s.status_mark) return { status: i.s.status, src: "mark" };
      return null;
    };
    items.forEach((i) => {
      if (i.kind === "section") return;
      const o = own(i);
      if (o) { i.status = o.status; i.src = o.src; }
    });
    items.forEach((i) => {
      if (i.kind !== "task" || i.status) return;
      const g = isSub(i) ? by[i.parent] : null;
      if (g && i.due < T && g.status && (g.src === "mark" || g.src === "edit")) {
        i.status = g.status; i.src = "inherited"; i.inheritedFrom = g.num;
      } else if (i.due < T) { i.status = "Нет отметки"; i.src = "rule"; }
      else { i.status = "Не начато"; i.src = "rule"; }
    });
    items.forEach((g) => {
      if (g.kind !== "group" || g.status) return;
      const st = g.children.map((c) => c.status);
      let r = "Не начато";
      if (st.every((x) => x === "Закрыто")) r = "Закрыто";
      else if (st.some((x) => x === "Закрыто" || ACTIVE.has(x))) r = "В работе";
      else if (st.some((x) => x === "Нет отметки")) r = "Нет отметки";
      g.status = r; g.src = "derived";
    });

    // Признаки срока [SPEC 4.3]
    items.forEach((i) => {
      if (i.kind === "section") return;
      i.cls = CLS[i.status];
      i.closed = i.status === "Закрыто";
      i.remain = i.due - T;
      i.overdue = !i.closed && i.due < T;
      i.overdueDays = i.overdue ? T - i.due : 0;
      i.soon = !i.closed && i.remain >= 0 && i.remain <= 7;
      i.ctrlPassed = !i.closed && i.ctrl != null && i.ctrl < T;
      i.ctrlDays = i.ctrlPassed ? T - i.ctrl : 0;
      if (i.closed) {
        const cd = i.edit && i.edit.closeDoc;
        i.closeDate = cd ? dn(cd.date) : i.closedDate;
        i.noReq = cd ? !(cd.name && cd.name.trim()) : (i.src === "mark" && i.closedDate == null);
      }
      i.horizon = i.closed ? "closed" : i.remain < 0 ? "overdue" : i.remain <= 14 ? "h14" : i.remain <= 30 ? "h30" : i.remain <= 60 ? "h60" : "later";
      i.inBase = !isSub(i) || (i.kind === "task" && i.dueCust != null);
      i.comment = (i.edit && i.edit.comment) || "";
    });
    items.forEach((g) => {
      if (g.kind !== "group") return;
      g.progress = { closed: g.children.filter((c) => c.closed).length, total: g.children.length };
      g.overdueSubs = g.children.filter((c) => c.overdue && !c.inBase).map((c) => c.num);
    });

    const work = items.filter((i) => i.kind !== "section");
    const base = work.filter((i) => i.inBase);

    // KPI [SPEC 4.5, Р-44]
    const reached = base.filter((i) => i.due < T);
    const kpi = {
      base: base.length,
      closed: base.filter((i) => i.closed).length,
      noReq: base.filter((i) => i.closed && i.noReq).length,
      reached: reached.length,
      reachedClosed: reached.filter((i) => i.closed).length,
      overdue: base.filter((i) => i.overdue).length,
      early: base.filter((i) => i.closed && i.due >= T).length,
      ctrlPassed: base.filter((i) => i.ctrlPassed).length,
      active: base.filter((i) => ACTIVE.has(i.status)).length,
      toDemoWd: cal.wd(T, dn("2026-11-30")),
      toDemo: dn("2026-11-30") - T,
      toEnd: dn(seed.project.stage_end) - T,
    };
    kpi.pct = Math.round((kpi.closed / kpi.base) * 100);

    // Прогресс разделов [SPEC 4.6]
    const sectionOf = (i) => { const p = i.num.split("."); return p[0] === "2" ? p.slice(0, 2).join(".") : p[0]; };
    const sections = ["1", "2.1", "2.2", "3"].map((sn) => {
      const list = base.filter((i) => sectionOf(i) === sn);
      return { num: sn, name: by[sn].name, total: list.length, closed: list.filter((i) => i.closed).length, overdue: list.filter((i) => i.overdue).length };
    });

    // Окна цепочки [Р-47, SPEC 4.7]
    const chainNums = cfg.CHAIN;
    const F = {};
    const forecast = (i, prevF, prevP) => {
      if (i.closed) return i.closeDate != null ? i.closeDate : i.due;
      let f = Math.max(i.due, T);
      if (prevF != null) f = Math.max(f, cal.shift(prevF, Math.min(prevP, 0)));
      return f;
    };
    const windows = [];
    let prevF = null, prevP = null;
    chainNums.forEach((n, k) => {
      const i = by[n];
      F[n] = forecast(i, prevF, prevP);
      if (k < chainNums.length - 1) {
        const j = by[chainNums[k + 1]];
        const P = cal.wd(i.due, j.due);
        windows.push({ from: n, to: j.num, P });
        prevP = P;
      }
      prevF = F[n];
    });
    const feederI = by[cfg.FEEDER.from];
    F[cfg.FEEDER.from] = forecast(feederI, null, null);
    const winState = (w) => {
      const a = by[w.from], b = by[w.to];
      const R = cal.wd(F[w.from], b.due);
      const E = w.P - R;
      let state;
      if (a.closed && b.closed) state = "done";
      else if (R < Math.min(w.P, 0)) state = "breach";
      else if (E > 0) state = "eroding";
      else if (w.P < 0) state = "overlap";
      else if (w.P <= 1) state = "thin";
      else state = "ok";
      const breachFrom = state === "eroding" && !a.closed ? cal.nextWork(b.due) : null;
      return { ...w, R, E, state, breachFrom };
    };
    const chainWindows = windows.map(winState);
    const feeder = winState({ from: cfg.FEEDER.from, to: cfg.FEEDER.to, P: cal.wd(feederI.due, by[cfg.FEEDER.to].due), feeder: true });
    const rank = { breach: 3, eroding: 2, overlap: 1, thin: 1, ok: 1, done: 0 };
    const worst = [...chainWindows, feeder].reduce((a, w) => (rank[w.state] > rank[a] ? w.state : a), "done");
    const chainState = worst === "breach" ? "breach" : worst === "eroding" ? "eroding" : chainNums.every((n) => by[n].closed) ? "done" : "ok";
    const chainSet = new Set([...chainNums, cfg.FEEDER.from]);

    // «Топ-5 рисков» [Р-26, Р-50]
    const ord = (a, b) => a.idx - b.idx;
    const open = work.filter((i) => !i.closed);
    const inChain = (i) => chainSet.has(i.num);
    const cats = [
      open.filter((i) => inChain(i) && i.overdue).sort((a, b) => b.overdueDays - a.overdueDays || ord(a, b)).map((i) => [i, "chain-overdue"]),
      open.filter((i) => inChain(i) && i.soon).sort((a, b) => a.remain - b.remain || ord(a, b)).map((i) => [i, "chain-soon"]),
      open.filter((i) => !inChain(i) && i.inBase && i.overdue).sort((a, b) => b.overdueDays - a.overdueDays || ord(a, b)).map((i) => [i, "overdue"]),
      open.filter((i) => !inChain(i) && i.inBase && i.ctrlPassed).sort((a, b) => b.ctrlDays - a.ctrlDays || ord(a, b)).map((i) => [i, "ctrl"]),
      open.filter((i) => !inChain(i) && i.inBase && i.soon).sort((a, b) => a.remain - b.remain || ord(a, b)).map((i) => [i, "soon"]),
    ];
    const seen = new Set(), top5 = [];
    cats.flat().forEach(([i, why]) => { if (top5.length < 5 && !seen.has(i.num)) { seen.add(i.num); top5.push({ item: i, why }); } });

    return { items, by, work, base, kpi, sections, chainNums, chainSet, chainWindows, feeder, chainState, F, cal, T, top5 };
  }

  /** Текст повестки [SPEC 6, Р-33, Р-50]. */
  function agenda(M) {
    const line = (i) => {
      let c = i.comment || i.s.status_mark || "";
      if (i.kind === "group" && i.overdueSubs && i.overdueSubs.length) {
        c = (c ? c + "; " : "") + `просрочены подпозиции ${i.overdueSubs.join(", ")}`;
      }
      return `${i.name}${c ? " — " + c : ""} (п. ${i.num})`;
    };
    const base = M.base.filter((i) => !i.closed);
    const groupWithSubs = (i) => i.kind === "group" && i.overdueSubs.length;
    const s1 = base.filter((i) => i.overdue || groupWithSubs(i));
    const s2 = base.filter((i) => !s1.includes(i) && i.ctrlPassed);
    const s3 = base.filter((i) => !s1.includes(i) && !s2.includes(i) && i.remain >= 0 && i.remain <= 14);
    const out = [`Повестка оперативки по этапу 1 ОКР «ЯМГ-ИИМ» на ${fmt(M.T)}`, ""];
    const sec = (title, list) => {
      out.push(title);
      if (!list.length) out.push("— позиций нет");
      list.forEach((i, k) => out.push(`${k + 1}. ${line(i)}`));
      out.push("");
    };
    sec("1. Просрочено", s1);
    sec("2. Контрольная дата прошла", s2);
    sec("3. Срок в ближайшие 14 дней", s3);
    return { text: out.join("\n").trim(), counts: [s1.length, s2.length, s3.length], lists: [s1, s2, s3] };
  }

  /**
   * Проверка правок из хранилища браузера [Р-70]: остаются только работы из данных,
   * статусы словаря, документ закрытия со строковыми полями и датой ISO, комментарий-строка (≤ 2000 знаков).
   * Повреждённое или чужое содержимое хранилища не должно ломать расчёт.
   */
  function sanitizeEdits(seed, raw) {
    const out = {}, dropped = [];
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return { edits: out, dropped: raw == null ? [] : ["*"] };
    const nums = new Set(seed.items.filter((i) => i.kind !== "section").map((i) => i.num));
    const str = (v, n) => (typeof v === "string" ? v.slice(0, n) : "");
    Object.keys(raw).forEach((num) => {
      const e = raw[num];
      if (!nums.has(num) || !e || typeof e !== "object") { dropped.push(num); return; }
      const r = {};
      if (typeof e.status === "string" && STATUSES.includes(e.status)) r.status = e.status;
      if (e.closeDoc && typeof e.closeDoc === "object" && r.status === "Закрыто") {
        const d = parseISO(str(e.closeDoc.date, 10));
        r.closeDoc = { name: str(e.closeDoc.name, 500), letter: str(e.closeDoc.letter, 100), date: d != null ? iso(d) : "" };
      }
      if (typeof e.comment === "string" && e.comment.trim()) r.comment = e.comment.slice(0, 2000);
      if (Object.keys(r).length) out[num] = r; else dropped.push(num);
    });
    return { edits: out, dropped };
  }

  return { build, agenda, sanitizeEdits, dn, fmt, iso, parseISO, todayLocal, remainText, plural, STATUSES, CLS, ACTIVE, calendar };
})();
if (typeof module !== "undefined") module.exports = Engine;

</script>
<script>
/* CRM «Квантовый сенсор ИИМ ЯМГ (Электроприбор)» — интерфейс. Модули: src/ui/core, chrome, summary, gantt, focus, board, milestones, panel, dialogs, main. */
(function () {
  "use strict";
  /* Ядро интерфейса: данные, параметры ссылки, состояние, форматы, роли участников, шкала этапа [SPEC §2–4; Р-55, Р-61]. */
  const E = Engine, C = CONFIG, SEED = window.SEED;
  const VARIANT = window.VARIANT || "panel";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ── Иконки Lucide (ISC), штриховые
  const ICONS = {
    chev: '<path d="m6 9 6 6 6-6"/>', x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/>',
    reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
    arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
    printer: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>',
  };
  const ico = (n, cls = "") => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

  // ── Хранилище: только удобство, страница работает без него
  const store = {
    ok: true,
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { this.ok = false; return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { this.ok = false; } },
  };
  try { const t = "__orbita_probe__"; window.localStorage.setItem(t, "1"); window.localStorage.removeItem(t); } catch (e) { store.ok = false; }

  // ── Параметры ссылки [SPEC §3]
  const q = new URLSearchParams(location.search);
  const notices = [];
  let T = E.todayLocal(), todayFromLink = false;
  if (q.has("today")) {
    const t = E.parseISO(q.get("today"));
    if (t != null) { T = t; todayFromLink = true; } else notices.push("Параметр today не распознан, использована текущая дата.");
  }
  let orgKey = null, orgName = null;
  if (q.has("org")) {
    if (C.ORGS[q.get("org")]) { orgKey = q.get("org"); orgName = C.ORGS[orgKey]; }
    else notices.push("Параметр org не распознан: открыто полное представление только для просмотра.");
  }
  // Режим для руководства: ?view=exec (первый экран) или ?exec=1 (сохраняется при смене вкладки) [Р-67]
  const exec = q.get("view") === "exec" || q.get("exec") === "1";
  const readonly = exec || q.has("org");

  let view = q.get("view") === "exec" ? "summary" : q.get("view");

  let theme = q.get("theme");

  // ── Состояние
  let edits = {};

  // Дата редакции отметок «Важного» [Р-70]: при расчёте на другую дату отметки могут быть устаревшими
  const EDITION = E.parseISO(SEED.project.demo_today);
  const S = { filters: { owner: "", section: "", search: "" }, slice: "all", collapsed: new Set(), selected: null, closeForm: null, msDate: null, lanes: { later: false, closed: false }, agendaOpen: false, agendaFmt: "talk", helpOpen: false, returnFocus: null };
  let M;
  const saveEdits = () => { if (!readonly) store.set(C.STORAGE_KEY, JSON.stringify(edits)); };
  const recompute = () => { M = E.build(SEED, C, edits, T); };

  // ── Слова и форматы
  const fmt = E.fmt;
  const pl = (n, a, b, c) => E.plural(n, a, b, c);

  // ФТИ и ИХС — соисполнители по договорам с Электроприбором; СП «Квант» — Заказчик.
  const EP = "Электроприбор", KV = "СП «Квант»", COS = ["ФТИ им. Иоффе", "ИХС им. Гребенщикова"];
  const CO_SHORT = { "ФТИ им. Иоффе": "ФТИ", "ИХС им. Гребенщикова": "ИХС" };
  const resp = (i) => (i.owners.some((o) => o === EP || COS.includes(o)) ? EP : i.owners.includes(KV) ? KV : i.owners[0]);
  const cosOf = (i) => i.owners.filter((o) => COS.includes(o));
  const OWNER_F = {
    ep: (i) => resp(i) === EP, fti: (i) => i.owners.includes("ФТИ им. Иоффе"), ihs: (i) => i.owners.includes("ИХС им. Гребенщикова"), kv: (i) => i.owners.includes(KV),
  };
  const orgMatch = (i) => !orgKey || (orgKey === "elektropribor" ? resp(i) === EP : i.owners.includes(orgName));
  const showChain = !orgKey;
  /** Ответственный и участники словами: «Электроприбор · соисполнитель ФТИ им. Иоффе». */
  const ownersText = (i) => {
    const r = resp(i), co = cosOf(i);
    if (r === KV) return "СП «Квант» (Заказчик)";
    let t = r;
    if (co.length) t += ` · ${co.length > 1 ? "соисполнители" : "соисполнитель"} ${co.map((o) => (co.length > 1 ? CO_SHORT[o] : o)).join(", ")}`;
    if (i.owners.includes(KV)) t += " · с участием Заказчика";

  };
  /** Краткая форма для таблицы: ответственный + метка участников. */
  const ownersCell = (i) => {

    return `<span title="${esc(ownersText(i))}">${esc(r === KV ? "Заказчик" : r)}${tags.length ? `<span class="co">+ ${esc(tags.join(", "))}</span>` : ""}</span>`;
  };

  /** Статус: цветная точка + слово; пометки — вторичным текстом [Р-16, Р-51]. */
  const status = (i, withNote = true) => {

    if (withNote && i.closed && i.noReq) note = "без документа";

  };
  /** Срок словами: «просрочено на 13 дней», «через 2 дня», «выполнено 04.09.2026». */
  const dueWords = (i, compact) => {

    if (i.soon) return `<span class="due-t warn">${compact ? `через ${i.remain} дн.` : `через ${days(i.remain)}`}</span>`;
    return compact ? "" : `<span class="due-t">через ${days(i.remain)}</span>`;
  };
  const sectionOf = (num) => { const p = num.split("."); return p[0] === "2" ? p.slice(0, 2).join(".") : p[0]; };
  const matchesFilters = (i) => {
    const f = S.filters;
    if (f.owner && OWNER_F[f.owner] && !OWNER_F[f.owner](i)) return false;
    if (f.section && sectionOf(i.num) !== f.section) return false;
    if (f.search) {
      const s = f.search.toLowerCase().trim();
      if (!(i.num.startsWith(s) || i.name.toLowerCase().includes(s) || title(i).toLowerCase().includes(s))) return false;
    }
    return orgMatch(i);
  };
  const anyFilter = () => S.filters.owner || S.filters.section || S.filters.search;

  // ── Шкала этапа
  const D0 = E.dn("2026-08-13"), D1 = E.dn("2027-02-02");

  const MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
  const monthStarts = () => {
    const out = [];

  const MS = SEED.milestones.map((m) => ({ n: E.dn(m.date), title: m.title, date: m.date }));
  const MS_SHORT = {
    "2026-09-30": "Закрытие 3 квартала", "2026-11-16": "Отчёты соисполнителей", "2026-11-24": "Приглашение на демонстрацию",
    "2026-11-30": "Демонстрация лабораторного образца", "2026-12-01": "Передача технического проекта", "2026-12-30": "Окончание этапа 1",
    "2027-01-01": "Начало этапа 2", "2027-02-01": "Акт сдачи-приёмки этапа 1",
  };

  /* Общие элементы страницы: шапка, плашки, панель инструментов, заголовок режима, подписи вех [Р-59, Р-60]. */
  // ── Шапка и уведомления
  function renderHeader() {

    return `<header class="top">

  function renderBanners() {
    let h = "";

  function toolbar(extra = "") {

    const secOpts = [["1", "Запуск"], ["2.1", "3 квартал 2026 года"], ["2.2", "4 квартал 2026 года"], ["3", "Сдача этапа 1"]];
    return `<div class="toolbar" role="search">
      <label class="field search">${ico("search")}<span class="sr">Поиск по наименованию или номеру</span><input type="search" data-f="search" data-k="f-search" placeholder="Поиск работы" value="${esc(S.filters.search)}"></label>
      ${orgKey ? "" : `<label class="field"><span class="sr">Исполнитель</span><select data-f="owner" data-k="f-owner"><option value="">Все участники</option>${ownerOpts.map(([v, t]) => `<option value="${v}" ${S.filters.owner === v ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`}
      <label class="field"><span class="sr">Раздел</span><select data-f="section" data-k="f-section"><option value="">Все разделы</option>${secOpts.map(([v, t]) => `<option value="${v}" ${S.filters.section === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>

      <div class="spacer"></div>${extra}
    </div>`;
  }
  const emptyFiltered = () => `<div class="empty" role="status"><p>Нет работ, соответствующих условиям. Измените поиск или сбросьте фильтр.</p><button class="btn" data-act="reset-filters" data-k="reset-f2">Сбросить фильтр</button></div>`;

  /** Заголовок режима: вывод одной фразой и, при необходимости, полоса показателей [Р-60]. */
  const pageHead = (id, h, lead, extra = "") => (extra ? `<section class="phead" aria-labelledby="${id}"><h1 id="${id}" class="sr">${esc(h)}</h1>${extra}</section>` : `<h1 id="${id}" class="sr">${esc(h)}</h1>`);
  /** Подписи вех по дорожкам без наложения; W — ширина полосы в пикселях. */
  function msLabels(W, top) {
    const lanes = []; let h = "";
    MS.forEach((m) => {
      const x = (xp(m.n) / 100) * W, name = MS_SHORT[m.date] || m.title, w = 44 + name.length * 7;
      const right = x + w > W, a = right ? x - w : x, b = right ? x : x + w;
      let lane = lanes.findIndex((r) => a >= r + 12);
      if (lane < 0) { lanes.push(0); lane = lanes.length - 1; }
      lanes[lane] = b;
      h += `<span class="stl-lbl${m.n < T ? " past" : ""}${right ? " r" : ""}" style="left:${xp(m.n)}%;top:${top + lane * 22}px"><b>${fmt(m.n).slice(0, 5)}</b> ${esc(name)}</span>`;
      h += `<span class="stl-tick" style="left:${xp(m.n)}%;top:${top - 22}px;height:${lane * 22 + 22}px"></span>`;
    });
    return { html: h, lanes: lanes.length };
  }
  const bandW = (min) => Math.max(min, (root.clientWidth || innerWidth) - 2 * 32 - 2 * 24);

  /* Режим «Сводка» (В1, В3): вывод, показатели, сроки этапа, участники, путь к демонстрации [Р-58]. */
  // ── СВОДКА
  function headline() {
    const k = M.kpi;
    if (M.work.every((i) => i.closed)) return { h: "Все обязательства этапа 1 выполнены", t: "Просроченных и предстоящих работ нет." };
    const h = k.overdue ? `Этап 1 идёт с отставанием: ${k.overdue} ${pl(k.overdue, "обязательство просрочено", "обязательства просрочены", "обязательств просрочено")}` : "Этап 1 идёт по графику: просроченных обязательств нет";
    let t = `На ${fmt(T)} выполнено ${k.closed} из ${k.base} обязательств перед Заказчиком.`;
    if (k.toDemo > 0) t += ` До демонстрации лабораторного образца — ${wdays(k.toDemoWd)}.`;
    const w = M.chainWindows.find((x) => x.state === "breach") || M.chainWindows.find((x) => x.state === "eroding");
    if (w && w.state === "eroding") t += ` Резерв перед этапом «${title(M.by[w.to])}» почти исчерпан.`;
    if (w && w.state === "breach") t += " Путь к демонстрации под угрозой срыва.";
    return { h, t };
  }
  function kpiTiles() {
    const k = M.kpi;
    const tile = (id, lbl, val, sub, act, tone) => `<button class="kpi${tone ? " " + tone : ""}" data-act="${act}" data-k="kpi-${id}"><span class="lbl">${lbl}</span><span class="val">${val}</span><span class="sub">${sub}</span></button>`;
    return [
      tile("closed", "Выполнено", `${k.closed}<small> из ${k.base}</small>`, `${k.pct} %${k.noReq ? ` · ${k.noReq} без документа` : ""}`, "go-board"),
      tile("plan", "План на сегодня", `${k.reachedClosed}<small> из ${k.reached}</small>`, k.early ? `ещё ${k.early} — досрочно` : "", "go-overdue"),
      tile("overdue", "Просрочено", `${k.overdue}`, "", "go-overdue", k.overdue ? "bad" : ""),
      tile("demo", "До демонстрации образца", k.toDemo >= 0 ? `${k.toDemoWd}<small> ${pl(k.toDemoWd, "рабочий день", "рабочих дня", "рабочих дней")}</small>` : `<small>прошла</small>`, "30.11.2026", "go-chain"),
      tile("end", "До окончания этапа", k.toEnd >= 0 ? `${k.toEnd}<small> ${pl(k.toEnd, "день", "дня", "дней")}</small>` : `<small>этап завершён</small>`, "30.12.2026", "go-ms"),
    ].join("");
  }
  /** Полоса сроков этапа: обязательства по неделям, вехи, «сегодня» [Р-58]. */
  function stageTimeline() {
    const weeks = new Map();
    M.base.forEach((i) => {
      const wd = (new Date(i.due * 86400000).getUTCDay() + 6) % 7, wk = i.due - wd;
      const w = weeks.get(wk) || { closed: 0, overdue: 0, open: 0, list: [] };
      w[i.closed ? "closed" : i.overdue ? "overdue" : "open"]++; w.list.push(title(i)); weeks.set(wk, w);
    });
    const max = Math.max(1, ...[...weeks.values()].map((w) => w.list.length));
    const seg = Math.max(4, Math.min(10, Math.floor(96 / max) - 2));
    let h = `<div class="stl-scroll"><div class="stl" role="img" aria-label="Сроки обязательств по неделям этапа с 13.08.2026 по 01.02.2027, вехи и линия «сегодня»">`;
    monthStarts().forEach((m) => { h += `<span class="stl-grid" style="left:${xp(m.n)}%"></span>` + (xp(m.n) < 97 ? `<span class="stl-month" style="left:${xp(m.n)}%">${m.label}</span>` : ""); });
    weeks.forEach((w, wk) => {

      ["closed", "overdue", "open"].forEach((c) => { for (let k = 0; k < w[c]; k++) segs.push(`<i class="${c}" style="height:${seg}px"></i>`); });
      h += `<span class="stl-bar" style="left:${xp(wk)}%;width:calc(${xp(wk + 7) - xp(wk)}% - 6px)" title="Неделя с ${fmt(wk)}: ${w.list.length} — ${esc(w.list.join("; "))}">${segs.join("")}${w.list.length >= 3 ? `<b>${w.list.length}</b>` : ""}</span>`;
    });
    h += `<div class="stl-axis"></div>`;
    const lb = msLabels(bandW(720), 144);
    MS.forEach((m) => { h += `<span class="stl-ms${m.n < T ? " past" : ""}" style="left:${xp(m.n)}%" title="${fmt(m.n)} — ${esc(m.title)}"></span>`; });
    h += lb.html;
    if (T >= D0 && T <= D1) h += `<div class="stl-today" style="left:${xp(T)}%"><span>сегодня</span></div>`;
    h += `</div></div><div class="legend stl-leg" aria-hidden="true"><span><i class="lg closed"></i>выполнено</span><span><i class="lg overdue-s"></i>просрочено</span><span><i class="lg future"></i>предстоит</span><span><i class="lg ms"></i>веха</span></div>`;
    return `<style>.stl{height:${150 + lb.lanes * 22 + 4}px}</style>` + h;
  }
  /** Исполнитель, соисполнители и Заказчик: кто за что отвечает [Р-61]. */
  function ownersBlock() {
    const row = (key, name, role, l, nextWord) => {

      const nx = l.filter((i) => !i.closed && i.due >= T).sort((a, b) => a.due - b.due || a.idx - b.idx)[0];

      return `<li><button class="orow${key === "ep" ? " main" : ""}" data-act="go-owner" data-owner="${key}" data-k="own-${key}">
        <span class="t">${esc(name)}<span class="role">${role}</span></span><span class="n">выполнено ${cl} из ${l.length}${od ? ` · <span class="bad-t">просрочено ${od}</span>` : ""}</span>
        <span class="prog" role="img" aria-label="Выполнено ${cl} из ${l.length}"><i style="width:${(cl / l.length) * 100}%"></i></span>
        <span class="nx">${nx ? `${nextWord} <span class="mono">${fmt(nx.due)}</span> — ${esc(title(nx))}` : old ? `предстоящих сроков нет; дольше всех просрочено — ${esc(title(old))} (срок <span class="mono">${fmt(old.due)}</span>)` : "открытых обязательств нет"}</span></button></li>`;
